[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bimddc-grid"
version = "0.1.0"
description = "Structural grid model for BIM/DDC applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0"
    "pyside6"
]

[tool.setuptools.packages.find]
where = ["src"]
